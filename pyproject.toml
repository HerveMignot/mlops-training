[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "training"
version = "0.1.0"
description = "MLOps training project"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn",
    "pandas",
    "jupyter",
    "matplotlib",
    "mlflow==3.13",
    "fastapi",
    "uvicorn[standard]",
    "pyyaml",
    "streamlit",
    "requests",
    "dvc>=3.67.1",
    "numpyro>=0.22.0",
    "arviz>=1.3.0",
    "netcdf4>=1.7.4",
    "evidently>=0.7.23",
    "prefect>=3.8.7",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/training"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
